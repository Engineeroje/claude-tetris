name: Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.
            Título: ${{ github.event.issue.title }}
            Cuerpo:
            ${{ github.event.issue.body }}

            Lee CLAUDE.md y el código relevante (game.js, index.html, style.css) antes de responder. No modifiques ningún archivo.

            Tareas:
            1. Labels: ejecuta `gh label list` y elige solo labels que ya existan y sean apropiados (por ejemplo bug, enhancement, question, documentation). Si la información del issue es insuficiente, añade `needs-info`. Aplícalos con `gh issue edit ${{ github.event.issue.number }} --add-label "<labels>"`. Quita labels previos de triage solo si contradicen el análisis actual.
            2. Diagnóstico: escribe un comentario en español, en formato Markdown válido para GitHub (encabezados, listas y bloques de código con su lenguaje), con estas secciones:
               - Resumen del problema o petición
               - Tipo y severidad estimada
               - Causa probable (si es un bug) o análisis de viabilidad (si es una mejora), citando funciones y archivos concretos como collide(), tryRotate(), clearLines() en game.js
               - Pasos propuestos para implementar la solución
               - Preguntas abiertas o información que falta
            3. Publicación: el comentario debe empezar con la marca `<!-- claude-triage -->`. Antes de publicar, busca un comentario existente con esa marca con `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments`. Si existe, actualízalo con `gh api -X PATCH` sobre su id en lugar de crear uno nuevo; si no existe, créalo con `gh issue comment ${{ github.event.issue.number }} --body "<texto>"`.

          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh api:*),Read,Grep,Glob"
